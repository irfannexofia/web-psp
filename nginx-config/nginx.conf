# PSP Website Nginx Configuration
# Optimized for Next.js static export with multi-language support
# Auto-redirect main domain to /en/ for default language

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name phillippesuryapratama.com www.phillippesuryapratama.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phillippesuryapratama.com www.phillippesuryapratama.com;
    
    root /var/www/phillippesuryapratama.com;
    index index.html;
    
    ssl_certificate /etc/letsencrypt/live/phillippesuryapratama.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phillippesuryapratama.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Main page redirect to /en (English default)
    location = / {
        return 301 https://$host/en/;
    }
    
    # Indonesian route
    location = /id/ {
        try_files /id/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # English route  
    location = /en/ {
        try_files /en/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # CSS files with cache busting
    location ~* \.css$ {
        add_header Content-Type "text/css";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;
    }
    
    # JavaScript files with cache busting
    location ~* \.js$ {
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;
    }
    
    # Next.js static files
    location /_next/static/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;
    }
    
    # Other static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }
}
